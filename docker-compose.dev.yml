name: sembrar-dev

services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: sembrar
      MYSQL_USER: sembrar
      MYSQL_PASSWORD: sembrar_dev
      MYSQL_ROOT_PASSWORD: sembrar_root_dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./.dev/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /var/www/symfony
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: sembrar-local-development-only
      DATABASE_URL: "mysql://sembrar:sembrar_dev@mysql:3306/sembrar?serverVersion=8.0.36&charset=utf8mb4"
      MAILER_DSN: "null://null"
      WKHTMLTOPDF_PATH: /usr/bin/wkhtmltopdf
      WKHTMLTOIMAGE_PATH: /usr/bin/wkhtmltoimage
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /composer-cache
      DEV_ADMIN_EMAIL: "${DEV_ADMIN_EMAIL:-admin@sembrar.local}"
      DEV_ADMIN_PASSWORD: "${DEV_ADMIN_PASSWORD:-sembrar-dev}"
      QT_QPA_PLATFORM: offscreen
    volumes:
      - ./sembrar:/var/www/symfony
      - ./.dev/composer-cache:/composer-cache
      - ./build/php/init-dev.php:/opt/sembrar/init-dev.php:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 3s
      timeout: 5s
      retries: 20

  node:
    image: node:22.14.0-bookworm-slim
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /var/www/symfony
    environment:
      npm_config_cache: /npm-cache
    volumes:
      - ./sembrar:/var/www/symfony
      - ./.dev/npm-cache:/npm-cache
    command: ["npm", "run", "watch"]
    init: true

  nginx:
    image: nginx:1.26.3-bookworm
    ports:
      - "127.0.0.1:${DEV_PORT:-8002}:80"
    volumes:
      - ./sembrar:/var/www/symfony:ro
      - ./build/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
